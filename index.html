<!DOCTYPE html>
<html lang="uk">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Безпека Поруч</title>

  <!-- ========================= -->
  <!-- PWA -->
  <!-- ========================= -->

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./icon-192.png"
  >

  <meta
    name="theme-color"
    content="#071d35"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >


  <!-- ========================= -->
  <!-- ДИЗАЙН -->
  <!-- ========================= -->

  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        #eef3f8;

      color:
        #071d35;

    }


    /* ========================= */
    /* HEADER */
    /* ========================= */

    header {

      background:
        #071d35;

      color:
        white;

      padding:
        18px 15px;

      text-align:
        center;

      position:
        sticky;

      top:
        0;

      z-index:
        100;

      box-shadow:
        0 2px 8px
        rgba(0,0,0,0.2);

    }


    header h1 {

      margin:
        0;

      font-size:
        22px;

    }


    header p {

      margin:
        5px 0 0;

      font-size:
        13px;

      opacity:
        0.85;

    }


    /* ========================= */
    /* ОСНОВНИЙ КОНТЕЙНЕР */
    /* ========================= */

    .container {

      max-width:
        900px;

      margin:
        auto;

      padding:
        18px;

    }


    /* ========================= */
    /* ЗАГОЛОВОК */
    /* ========================= */

    .title {

      margin-bottom:
        15px;

    }


    .title h2 {

      margin:
        0 0 5px;

      font-size:
        24px;

    }


    .title p {

      margin:
        0;

      color:
        #64748b;

    }


    /* ========================= */
    /* КАРТКИ */
    /* ========================= */

    .grid {

      display:
        grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(
            250px,
            1fr
          )
        );

      gap:
        15px;

    }


    .card {

      background:
        white;

      border-radius:
        16px;

      padding:
        20px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

      cursor:
        pointer;

      transition:
        0.2s;

      border:
        1px solid
        #e2e8f0;

    }


    .card:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 6px 18px
        rgba(0,0,0,0.15);

    }


    .icon {

      font-size:
        38px;

      margin-bottom:
        10px;

    }


    .card h3 {

      margin:
        0 0 8px;

      font-size:
        19px;

    }


    .card p {

      margin:
        0;

      color:
        #64748b;

      line-height:
        1.4;

    }


    /* ========================= */
    /* КНОПКА */
    /* ========================= */

    .back {

      display:
        inline-block;

      background:
        #0057b8;

      color:
        white;

      border:
        none;

      border-radius:
        10px;

      padding:
        12px 18px;

      font-size:
        16px;

      cursor:
        pointer;

      margin-bottom:
        18px;

    }


    /* ========================= */
    /* КРОК */
    /* ========================= */

    .step {

      background:
        white;

      border-radius:
        16px;

      padding:
        20px;

      margin-bottom:
        15px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,0.10);

    }


    .step-number {

      display:
        inline-block;

      background:
        #0057b8;

      color:
        white;

      border-radius:
        50%;

      width:
        38px;

      height:
        38px;

      line-height:
        38px;

      text-align:
        center;

      font-weight:
        bold;

      margin-right:
        8px;

    }


    .step h3 {

      display:
        inline;

      font-size:
        19px;

    }


    .step p {

      line-height:
        1.6;

      white-space:
        pre-line;

    }


    /* ========================= */
    /* ЗОБРАЖЕННЯ */
    /* ========================= */

    .step img {

      width:
        100%;

      max-height:
        500px;

      object-fit:
        contain;

      border-radius:
        12px;

      margin-top:
        10px;

      background:
        #f1f5f9;

    }


    /* ========================= */
    /* СТАН */
    /* ========================= */

    .loading {

      text-align:
        center;

      padding:
        50px 20px;

      color:
        #64748b;

      font-size:
        17px;

    }


    .error {

      background:
        #fee2e2;

      color:
        #991b1b;

      padding:
        18px;

      border-radius:
        12px;

      line-height:
        1.5;

    }


    .empty {

      text-align:
        center;

      padding:
        40px;

      color:
        #64748b;

    }

  </style>

</head>


<body>


<!-- ================================================= -->
<!-- HEADER -->
<!-- ================================================= -->

<header>

  <h1>
    🛡️ БЕЗПЕКА ПОРУЧ
  </h1>

  <p>
    Практична інформація та інструкції
  </p>

</header>


<!-- ================================================= -->
<!-- APP -->
<!-- ================================================= -->

<div
  class="container"
  id="app"
>

  <div class="loading">

    Завантаження...

  </div>

</div>


<script>


// =====================================================
// НАЛАШТУВАННЯ
// =====================================================

const API_URL =
  'https://script.google.com/macros/s/AKfycbyQuGOzPdzy-p8_V3xD4K91ZAksG7bp4Y9JUZodreiXpRUtfY6awr6ceA5G4tKrhnvs/exec';


// =====================================================
// DOM
// =====================================================

const app =
  document.getElementById('app');


// =====================================================
// ЗАПИТ ДО API
// =====================================================

async function apiRequest(
  action,
  params = {}
) {

  const url =
    new URL(API_URL);

  url.searchParams.set(
    'action',
    action
  );


  Object.keys(params).forEach(
    function(key) {

      url.searchParams.set(
        key,
        params[key]
      );

    }
  );


  const response =
    await fetch(
      url.toString(),
      {
        method:
          'GET',

        cache:
          'no-store'
      }
    );


  if (!response.ok) {

    throw new Error(
      'Помилка сервера: ' +
      response.status
    );

  }


  const data =
    await response.json();


  if (!data.success) {

    throw new Error(
      data.error ||
      'Невідома помилка API'
    );

  }


  return data.data;

}


// =====================================================
// ПОМИЛКА
// =====================================================

function showError(error) {

  console.error(error);

  app.innerHTML = `

    <div class="error">

      <strong>
        ⚠️ Не вдалося завантажити дані
      </strong>

      <br><br>

      ${escapeHtml(
        error.message ||
        'Невідома помилка'
      )}

      <br><br>

      Перевірте підключення до Інтернету
      та спробуйте ще раз.

      <br><br>

      <button
        class="back"
        onclick="loadSections()"
      >
        🔄 Повторити
      </button>

    </div>

  `;

}


// =====================================================
// ЗАХИСТ HTML
// =====================================================

function escapeHtml(value) {

  return String(value || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


// =====================================================
// ГОЛОВНА
// =====================================================

async function loadSections() {

  app.innerHTML = `

    <div class="loading">

      ⏳ Завантаження розділів...

    </div>

  `;


  try {

    const sections =
      await apiRequest(
        'sections'
      );


    renderSections(
      sections
    );


  }
  catch(error) {

    showError(
      error
    );

  }

}


// =====================================================
// ПОКАЗ РОЗДІЛІВ
// =====================================================

function renderSections(
  sections
) {

  if (
    !sections ||
    sections.length === 0
  ) {

    app.innerHTML = `

      <div class="empty">

        📭

        <h2>
          Розділів поки немає
        </h2>

        <p>
          Перевірте таблицю Google Sheets.
        </p>

      </div>

    `;

    return;

  }


  let html = `

    <div class="title">

      <h2>
        Розділи
      </h2>

      <p>
        Оберіть потрібну інструкцію
      </p>

    </div>

    <div class="grid">

  `;


  sections.forEach(
    function(section) {

      const icon =
        section['Іконка'] ||
        '📘';

      const name =
        section['Назва'] ||
        'Без назви';

      const description =
        section['Опис'] ||
        '';


      html += `

        <div
          class="card"
          onclick="openSection('${escapeAttribute(
            section['ID']
          )}')"
        >

          <div class="icon">

            ${escapeHtml(icon)}

          </div>

          <h3>

            ${escapeHtml(name)}

          </h3>

          <p>

            ${escapeHtml(description)}

          </p>

        </div>

      `;

    }
  );


  html += `

    </div>

  `;


  app.innerHTML =
    html;

}


// =====================================================
// ЗАХИСТ АТРИБУТА
// =====================================================

function escapeAttribute(
  value
) {

  return String(value || '')
    .replace(
      /\\/g,
      '\\\\'
    )
    .replace(
      /'/g,
      "\\'"
    );

}


// =====================================================
// ВІДКРИТТЯ РОЗДІЛУ
// =====================================================

async function openSection(
  sectionId
) {

  app.innerHTML = `

    <button
      class="back"
      onclick="loadSections()"
    >
      ← Назад
    </button>

    <div class="loading">

      ⏳ Завантаження інструкції...

    </div>

  `;


  try {

    const content =
      await apiRequest(
        'content',
        {
          section:
            sectionId
        }
      );


    renderContent(
      content
    );


  }
  catch(error) {

    showError(
      error
    );

  }

}


// =====================================================
// ПОКАЗ КОНТЕНТУ
// =====================================================

function renderContent(
  content
) {

  let html = `

    <button
      class="back"
      onclick="loadSections()"
    >
      ← До розділів
    </button>

  `;


  if (
    !content ||
    content.length === 0
  ) {

    html += `

      <div class="empty">

        📭

        <h2>
          Інструкція порожня
        </h2>

      </div>

    `;

    app.innerHTML =
      html;

    return;

  }


  content.forEach(
    function(item, index) {

      const number =
        item['Крок'] ||
        (index + 1);

      const title =
        item['Заголовок'] ||
        '';


      const text =
        item['Текст'] ||
        '';


      const photoId =
        item['ФотоID'] ||
        '';


      html += `

        <div class="step">

          <div>

            <span class="step-number">

              ${escapeHtml(number)}

            </span>

            <h3>

              ${escapeHtml(title)}

            </h3>

          </div>

      `;


      if (
        item['Підпункт']
      ) {

        html += `

          <p>

            <strong>
              ${escapeHtml(
                item['Підпункт']
              )}
            </strong>

          </p>

        `;

      }


      if (text) {

        html += `

          <p>

            ${escapeHtml(text)}

          </p>

        `;

      }


      // ===============================================
      // GOOGLE DRIVE ФОТО
      // ===============================================

      if (photoId) {

        html += `

          <img
            src="https://drive.google.com/thumbnail?id=${encodeURIComponent(
              photoId
            )}&sz=w1000"
            alt="Ілюстрація"
            loading="lazy"
          >

        `;

      }


      // ===============================================
      // ВІДЕО
      // ===============================================

      if (
        item['Відео']
      ) {

        html += `

          <p>

            <a
              href="${escapeHtml(
                item['Відео']
              )}"
              target="_blank"
              rel="noopener"
            >

              ▶️ Відкрити відео

            </a>

          </p>

        `;

      }


      html += `

        </div>

      `;

    }
  );


  app.innerHTML =
    html;

}


// =====================================================
// PWA SERVICE WORKER
// =====================================================

if (
  'serviceWorker'
  in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register('./sw.js')
        .then(
          function() {

            console.log(
              'Service Worker OK'
            );

          }
        )
        .catch(
          function(error) {

            console.error(
              'Service Worker:',
              error
            );

          }
        );

    }
  );

}


// =====================================================
// ЗАПУСК
// =====================================================

loadSections();


</script>


</body>

</html>
