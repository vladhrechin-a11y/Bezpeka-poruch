<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#071d35">

  <link rel="manifest"
        href="manifest.json">

  <title>Безпека Поруч</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #071d35;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #071d35;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    .shield {
      font-size: 45px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 24px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      opacity: .75;
    }

    /* =========================
       CONTAINER
    ========================= */

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 18px 15px 40px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search {
      width: 100%;
      border: none;
      outline: none;
      background: white;
      border-radius: 15px;
      padding: 15px;
      font-size: 16px;
      margin-bottom: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    /* =========================
       CARDS
    ========================= */

    .card {
      background: white;

      border-radius: 17px;

      padding: 17px;

      margin-bottom: 12px;

      display: flex;

      align-items: center;

      gap: 15px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.07);

      text-decoration: none;

      color: inherit;

      cursor: pointer;

      transition: .15s;
    }

    .card:active {
      transform: scale(.97);
    }

    .icon {
      width: 54px;
      height: 54px;

      flex-shrink: 0;

      border-radius: 15px;

      background: #e6edf6;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 28px;
    }

    .card h2 {
      margin: 0 0 5px;

      font-size: 17px;
    }

    .card p {
      margin: 0;

      color: #687582;

      font-size: 13px;
    }

    /* =========================
       PAGES
    ========================= */

    .page {
      display: none;
    }

    .page:target {
      display: block;
    }

       показуємо головну */
