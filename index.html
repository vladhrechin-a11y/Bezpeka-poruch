<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#071d35">

  <meta name="description"
        content="Інформаційна система Безпека Поруч">

  <link rel="manifest"
        href="manifest.json">

  <title>Безпека Поруч</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #071d35;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      background: #071d35;
      color: white;
      padding: 24px 18px 22px;
      text-align: center;
    }

    .shield {
      font-size: 44px;
    }

    .header h1 {
      margin: 5px 0 4px;
      font-size: 23px;
      letter-spacing: 1px;
    }

    .header p {
      margin: 0;
      font-size: 13px;
      opacity: .75;
    }


    /* =========================
       CONTAINER
    ========================= */

    .container {
      max-width: 650px;
      margin: auto;
      padding: 18px 15px 35px;
    }


    /* =========================
       SEARCH
    ========================= */

    .search {
      width: 100%;
      border: none;
      outline: none;

      background: white;

      border-radius: 15px;

      padding: 15px 17px;

      font-size: 15px;

      margin-bottom: 16px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.07);
    }


    /* =========================
       CARDS
    ========================= */

    .card {
      background: white;

      border-radius: 17px;

      padding: 17px;

      margin-bottom: 12px;

      display: flex;

      align-items: center;

      gap: 15px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.07);

      cursor: pointer;

      transition: .15s;
    }

    .card:active {
      transform: scale(.97);
    }

    .icon {
      width: 52px;
      height: 52px;

      border-radius: 14px;

      background: #e6edf6;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 27px;

      flex-shrink: 0;
    }

    .card h2 {
      margin: 0 0 5px;
      font-size: 17px;
    }

    .card p {
      margin: 0;

      color: #6d7885;

      font-size: 13px;
    }


    /* =========================
       PAGES
    ========================= */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back {
      display: inline-block;

      margin-bottom: 15px;

      padding: 10px 14px;

      background: white;

      border-radius: 12px;

      cursor: pointer;

      box-shadow:
        0 2px 8px rgba(0,0,0,.06);

      font-weight: bold;
    }


    /* =========================
       PAGE TITLE
    ========================= */

    .page-title {
      background: #071d35;

      color: white;

      border-radius: 17px;

      padding: 20px;

      margin-bottom: 15px;
    }

    .page-title .big-icon {
      font-size: 38px;
    }

    .page-title h2 {
      margin: 8px 0 4px;

      font-size: 23px;
    }

    .page-title p {
      margin: 0;

      opacity: .75;

      font-size: 13px;
    }


    /* =========================
       INFORMATION BLOCK
    ========================= */

    .info {
      background: white;

      border-radius: 16px;

      padding: 18px;

      margin-bottom: 12px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.07);
    }

    .info h3 {
      margin: 0 0 8px;

      font-size: 17px;
    }

    .info p {
      margin: 0;

      line-height: 1.55;

      color: #586675;

      font-size: 14px;
    }


    /* =========================
       BUTTON
    ========================= */

    .main-button {
      width: 100%;

      border: 0;

      border-radius: 15px;

      background: #071d35;

      color: white;

      padding: 16px;

      font-size: 16px;

      font-weight: bold;

      margin-top: 8px;

      cursor: pointer;
    }

    .main-button:active {
      transform: scale(.98);
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      color: #8a96a3;

      font-size: 12px;

      padding: 10px 20px 25px;
    }


    /* =========================
       EMPTY SEARCH
    ========================= */

    .empty {
      text-align: center;

      color: #7c8792;

      padding: 30px;

      display: none;
    }


    /* =========================
       STEP NUMBER
    ========================= */

    .step {
      display: flex;

      gap: 12px;

      align-items: flex-start;
    }

    .step-number {
      width: 34px;
      height: 34px;

      border-radius: 50%;

      background: #071d35;

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-weight: bold;

      flex-shrink: 0;
    }

  </style>
</head>


<body>
