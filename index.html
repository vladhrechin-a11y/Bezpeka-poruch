<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Безпека Поруч</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <meta name="theme-color" content="#0057b8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      color: #071d35;
      text-align: center;
    }

    .box {
      margin: 60px 20px;
      padding: 30px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }

    h1 {
      color: #0057b8;
    }

    button {
      width: 100%;
      max-width: 350px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #0057b8;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>🛡️ Безпека Поруч</h1>

    <p>Тест підключення до основної системи</p>

    <br>

    <button onclick="openSystem()">
      ВІДКРИТИ СИСТЕМУ
    </button>

  </div>

  <script>

    function openSystem() {

      window.location.href =
      "https://script.google.com/macros/s/AKfycbyQuGOzPdzy-p8_V3xD4K91ZAksG7bp4Y9JUZodreiXpRUtfY6awr6ceA5G4tKrhnvs/exec";

    }

    // PWA
    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker.register("./sw.js")
          .then(() => {
            console.log("Service Worker OK");
          })
          .catch(error => {
            console.error("Service Worker error:", error);
          });

      });

    }

  </script>

</body>
</html>
