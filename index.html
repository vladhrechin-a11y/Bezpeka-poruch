<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>Безпека Поруч</title>

<meta
  name="description"
  content="Практична інформація та інструкції"
>

<meta
  name="theme-color"
  content="#071d35"
>

<meta
  name="mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black-translucent"
>

<link
  rel="manifest"
  href="./manifest.json"
>

<link
  rel="icon"
  type="image/png"
  sizes="192x192"
  href="./icon-192.png"
>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    #eef3f8;

  color:
    #071d35;

  min-height:
    100vh;

}

/* ========================= */
/* HEADER */
/* ========================= */

header {

  position:
    sticky;

  top:
    0;

  z-index:
    100;

  background:
    linear-gradient(
      135deg,
      #071d35,
      #0b3158
    );

  color:
    white;

  padding:
    calc(14px + env(safe-area-inset-top))
    16px
    14px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,0.22);

}

.header-inner {

  max-width:
    900px;

  margin:
    auto;

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  gap:
    12px;

}

.logo {

  display:
    flex;

  align-items:
    center;

  gap:
    10px;

}

.logo-icon {

  font-size:
    30px;

}

.header-title {

  font-size:
    19px;

  font-weight:
    700;

}

.header-subtitle {

  font-size:
    12px;

  opacity:
    .8;

  margin-top:
    2px;

}

.status {

  font-size:
    11px;

  padding:
    6px 9px;

  border-radius:
    20px;

  background:
    rgba(255,255,255,.12);

  white-space:
    nowrap;

}

/* ========================= */
/* CONTAINER */
/* ========================= */

.container {

  max-width:
    900px;

  margin:
    auto;

  padding:
    18px 16px
    calc(30px + env(safe-area-inset-bottom));

}

/* ========================= */
/* TOP PANEL */
/* ========================= */

.hero {

  margin-bottom:
    18px;

}

.hero h2 {

  margin:
    0 0 5px;

  font-size:
    25px;

}

.hero p {

  margin:
    0;

  color:
    #64748b;

}

/* ========================= */
/* SEARCH */
/* ========================= */

.search-box {

  position:
    relative;

  margin:
    16px 0;

}

.search-box input {

  width:
    100%;

  border:
    1px solid #d6dee8;

  border-radius:
    14px;

  padding:
    14px 16px 14px 44px;

  font-size:
    16px;

  outline:
    none;

  background:
    white;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.05);

}

.search-box input:focus {

  border-color:
    #0057b8;

  box-shadow:
    0 0 0 3px
    rgba(0,87,184,.12);

}

.search-icon {

  position:
    absolute;

  left:
    15px;

  top:
    50%;

  transform:
    translateY(-50%);

  font-size:
    20px;

}

/* ========================= */
/* ACTIONS */
/* ========================= */

.actions {

  display:
    flex;

  gap:
    9px;

  margin-bottom:
    17px;

}

.action-btn {

  flex:
    1;

  border:
    none;

  border-radius:
    12px;

  padding:
    11px 10px;

  background:
    white;

  color:
    #071d35;

  font-size:
    13px;

  font-weight:
    600;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);

  cursor:
    pointer;

}

.action-btn:active {

  transform:
    scale(.98);

}

/* ========================= */
/* GRID */
/* ========================= */

.grid {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        250px,
        1fr
      )
    );

  gap:
    15px;

}

/* ========================= */
/* CARD */
/* ========================= */

.card {

  background:
    white;

  border-radius:
    17px;

  padding:
    20px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.09);

  cursor:
    pointer;

  border:
    1px solid
    #e2e8f0;

  transition:
    transform .15s,
    box-shadow .15s;

}

.card:hover {

  transform:
    translateY(-2px);

  box-shadow:
    0 7px 18px
    rgba(0,0,0,.14);

}

.card:active {

  transform:
    scale(.98);

}

.icon {

  font-size:
    38px;

  margin-bottom:
    10px;

}

.card h3 {

  margin:
    0 0 7px;

  font-size:
    19px;

}

.card p {

  margin:
    0;

  color:
    #64748b;

  line-height:
    1.4;

}

/* ========================= */
/* BACK BUTTON */
/* ========================= */

.back {

  border:
    none;

  background:
    #0057b8;

  color:
    white;

  border-radius:
    11px;

  padding:
    11px 17px;

  font-size:
    15px;

  font-weight:
    600;

  cursor:
    pointer;

  margin-bottom:
    17px;

}

/* ========================= */
/* STEP */
/* ========================= */

.step {

  background:
    white;

  border-radius:
    17px;

  padding:
    19px;

  margin-bottom:
    15px;

  box-shadow:
    0 3px 12px
    rgba(0,0,0,.09);

}

.step-header {

  display:
    flex;

  align-items:
    center;

  gap:
    9px;

}

.step-number {

  flex:
    0 0 38px;

  width:
    38px;

  height:
    38px;

  border-radius:
    50%;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    #0057b8;

  color:
    white;

  font-weight:
    700;

}

.step h3 {

  margin:
    0;

  font-size:
    19px;

}

.step p {

  line-height:
    1.6;

  white-space:
    pre-line;

}

.step img {

  width:
    100%;

  max-height:
    500px;

  object-fit:
    contain;

  border-radius:
    12px;

  margin-top:
    10px;

  background:
    #f1f5f9;

}

/* ========================= */
/* VIDEO */
/* ========================= */

.video-link {

  display:
    inline-block;

  margin-top:
    5px;

  padding:
    10px 14px;

  border-radius:
    10px;

  background:
    #071d35;

  color:
    white;

  text-decoration:
    none;

}

/* ========================= */
/* LOADING */
/* ========================= */

.loading {

  text-align:
    center;

  padding:
    55px 20px;

  color:
    #64748b;

  font-size:
    17px;

}

.spinner {

  width:
    34px;

  height:
    34px;

  border:
    4px solid #dbe5ef;

  border-top-color:
    #0057b8;

  border-radius:
    50%;

  animation:
    spin .8s linear infinite;

  margin:
    0 auto 15px;

}

@keyframes spin {

  to {
    transform:
      rotate(360deg);
  }

}

/* ========================= */
/* ERROR */
/* ========================= */

.error {

  background:
    #fee2e2;

  color:
    #991b1b;

  padding:
    18px;

  border-radius:
    14px;

  line-height:
    1.5;

}

/* ========================= */
/* EMPTY */
/* ========================= */

.empty {

  text-align:
    center;

  padding:
    45px 20px;

  color:
    #64748b;

}

/* ========================= */
/* INSTALL */
/* ========================= */

.install-banner {

  display:
    none;

  background:
    #0057b8;

  color:
    white;

  border-radius:
    15px;

  padding:
    13px;

  margin-bottom:
    16px;

  align-items:
    center;

  gap:
    10px;

}

.install-banner button {

  margin-left:
    auto;

  border:
    none;

  border-radius:
    9px;

  padding:
    9px 12px;

  font-weight:
    700;

  cursor:
    pointer;

}

/* ========================= */
/* FOOTER */
/* ========================= */

footer {

  text-align:
    center;

  color:
    #94a3b8;

  font-size:
    12px;

  padding:
    20px;

}

/* ========================= */
/* MOBILE */
/* ========================= */

@media(max-width:600px) {

  .container {

    padding:
      16px 12px 30px;

  }

  .grid {

    grid-template-columns:
      1fr;

  }

  .card {

    padding:
      18px;

  }

  .hero h2 {

    font-size:
      23px;

  }

}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">

      <div class="logo-icon">
        🛡️
      </div>

      <div>

        <div class="header-title">
          БЕЗПЕКА ПОРУЧ
        </div>

        <div class="header-subtitle">
          Практична інформація та інструкції
        </div>

      </div>

    </div>

    <div
      class="status"
      id="connectionStatus"
    >
      ● Перевірка...
    </div>

  </div>

</header>

<div class="container">

  <div
    class="install-banner"
    id="installBanner"
  >

    <span>
      📱 Встановити програму
    </span>

    <button
      id="installButton"
    >
      Встановити
    </button>

  </div>

  <div id="app">

    <div class="loading">

      <div class="spinner"></div>

      Завантаження...

    </div>

  </div>

</div>

<footer>

  Безпека Поруч

</footer>

<script>

/* =====================================================
   GOOGLE APPS SCRIPT
===================================================== */

const API_URL =
  'https://script.google.com/macros/s/AKfycbyQuGOzPdzy-p8_V3xD4K91ZAksG7bp4Y9JUZodreiXpRUtfY6awr6ceA5G4tKrhnvs/exec';


/* =====================================================
   DOM
===================================================== */

const app =
  document.getElementById('app');

const statusElement =
  document.getElementById('connectionStatus');

let allSections = [];

let deferredInstallPrompt = null;


/* =====================================================
   PWA INSTALL
===================================================== */

window.addEventListener(
  'beforeinstallprompt',
  function(event) {

    event.preventDefault();

    deferredInstallPrompt =
      event;

    document
      .getElementById('installBanner')
      .style.display =
      'flex';

  }
);


document
  .getElementById('installButton')
  .addEventListener(
    'click',
    async function() {

      if (!deferredInstallPrompt) {
        return;
      }

      deferredInstallPrompt.prompt();

      await deferredInstallPrompt.userChoice;

      deferredInstallPrompt =
        null;

      document
        .getElementById('installBanner')
        .style.display =
        'none';

    }
  );


/* =====================================================
   ONLINE / OFFLINE
===================================================== */

function updateConnectionStatus() {

  if (navigator.onLine) {

    statusElement.textContent =
      '● Онлайн';

    statusElement.style.color =
      '#9cffb0';

  } else {

    statusElement.textContent =
      '● Офлайн';

    statusElement.style.color =
      '#ffb4b4';

  }

}

window.addEventListener(
  'online',
  updateConnectionStatus
);

window.addEventListener(
  'offline',
  updateConnectionStatus
);

updateConnectionStatus();


/* =====================================================
   API
===================================================== */

async function apiRequest(
  action,
  params = {}
) {

  const url =
    new URL(API_URL);

  url.searchParams.set(
    'action',
    action
  );

  Object.keys(params).forEach(
    function(key) {

      url.searchParams.set(
        key,
        params[key]
      );

    }
  );

  const response =
    await fetch(
      url.toString(),
      {
        method:
          'GET',

        cache:
          'no-store'
      }
    );

  if (!response.ok) {

    throw new Error(
      'Помилка сервера: ' +
      response.status
    );

  }

  const data =
    await response.json();

  if (!data.success) {

    throw new Error(
      data.error ||
      'Невідома помилка API'
    );

  }

  return data.data;

}


/* =====================================================
   HTML SECURITY
===================================================== */

function escapeHtml(value) {

  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}


function escapeAttribute(value) {

  return String(value || '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, "\\'");

}


/* =====================================================
   ERROR
===================================================== */

function showError(error) {

  console.error(error);

  app.innerHTML = `

    <div class="error">

      <strong>
        ⚠️ Не вдалося завантажити дані
      </strong>

      <br><br>

      ${escapeHtml(
        error.message ||
        'Невідома помилка'
      )}

      <br><br>

      Перевірте підключення до Інтернету
      та спробуйте ще раз.

      <br><br>

      <button
        class="back"
        onclick="loadSections()"
      >
        🔄 Повторити
      </button>

    </div>

  `;

}


/* =====================================================
   LOADING
===================================================== */

function showLoading(text) {

  app.innerHTML = `

    <div class="loading">

      <div class="spinner"></div>

      ${escapeHtml(text)}

    </div>

  `;

}


/* =====================================================
   LOAD SECTIONS
===================================================== */

async function loadSections() {

  showLoading(
    'Завантаження розділів...'
  );

  try {

    const sections =
      await apiRequest(
        'sections'
      );

    allSections =
      sections || [];

    renderSections(
      allSections
    );

  }

  catch(error) {

    showError(error);

  }

}


/* =====================================================
   RENDER SECTIONS
===================================================== */

function renderSections(
  sections
) {

  if (
    !sections ||
    sections.length === 0
  ) {

    app.innerHTML = `

      <div class="empty">

        📭

        <h2>
          Розділів поки немає
        </h2>

        <p>
          Перевірте таблицю Google Sheets.
        </p>

      </div>

    `;

    return;

  }


  let html = `

    <div class="hero">

      <h2>
        Розділи
      </h2>

      <p>
        Оберіть потрібну інструкцію
      </p>

    </div>


    <div class="search-box">

      <span class="search-icon">
        🔎
      </span>

      <input
        id="searchInput"
        type="search"
        placeholder="Пошук інструкції..."
        autocomplete="off"
      >

    </div>


    <div class="actions">

      <button
        class="action-btn"
        onclick="loadSections()"
      >
        🔄 Оновити
      </button>

      <button
        class="action-btn"
        onclick="testConnection()"
      >
        📡 Тест підключення
      </button>

    </div>

    <div
      class="grid"
      id="sectionsGrid"
    >

  `;


  sections.forEach(
    function(section) {

      const icon =
        section['Іконка'] ||
        '📘';

      const name =
        section['Назва'] ||
        'Без назви';

      const description =
        section['Опис'] ||
        '';

      const id =
        section['ID'] ||
        '';


      html += `

        <div
          class="card"
          data-search="${escapeHtml(
            name + ' ' + description
          )}"
          onclick="openSection('${escapeAttribute(id)}')"
        >

          <div class="icon">
            ${escapeHtml(icon)}
          </div>

          <h3>
            ${escapeHtml(name)}
          </h3>

          <p>
            ${escapeHtml(description)}
          </p>

        </div>

      `;

    }
  );


  html += `

    </div>

  `;


  app.innerHTML =
    html;


  const searchInput =
    document.getElementById(
      'searchInput'
    );


  searchInput.addEventListener(
    'input',
    function() {

      const query =
        searchInput.value
          .toLowerCase()
          .trim();

      document
        .querySelectorAll(
          '#sectionsGrid .card'
        )
        .forEach(
          function(card) {

            const text =
              card.dataset.search
                .toLowerCase();

            card.style.display =
              text.includes(query)
                ? ''
                : 'none';

          }
        );

    }
  );

}


/* =====================================================
   OPEN SECTION
===================================================== */

async function openSection(
  sectionId
) {

  app.innerHTML = `

    <button
      class="back"
      onclick="loadSections()"
    >
      ← До розділів
    </button>

  `;

  showLoading(
    'Завантаження інструкції...'
  );

  try {

    const content =
      await apiRequest(
        'content',
        {
          section:
            sectionId
        }
      );

    renderContent(
      content
    );

    window.scrollTo(
      0,
      0
    );

  }

  catch(error) {

    showError(error);

  }

}


/* =====================================================
   RENDER CONTENT
===================================================== */

function renderContent(
  content
) {

  let html = `

    <button
      class="back"
      onclick="loadSections()"
    >
      ← До розділів
    </button>

  `;


  if (
    !content ||
    content.length === 0
  ) {

    html += `

      <div class="empty">

        📭

        <h2>
          Інструкція порожня
        </h2>

      </div>

    `;

    app.innerHTML =
      html;

    return;

  }


  content.forEach(
    function(item, index) {

      const number =
        item['Крок'] ||
        (index + 1);

      const title =
        item['Заголовок'] ||
        '';

      const text =
        item['Текст'] ||
        '';

      const photoId =
        item['ФотоID'] ||
        '';


      html += `

        <div class="step">

          <div class="step-header">

            <span class="step-number">
              ${escapeHtml(number)}
            </span>

            <h3>
              ${escapeHtml(title)}
            </h3>

          </div>

      `;


      if (
        item['Підпункт']
      ) {

        html += `

          <p>

            <strong>
              ${escapeHtml(
                item['Підпункт']
              )}
            </strong>

          </p>

        `;

      }


      if (text) {

        html += `

          <p>
            ${escapeHtml(text)}
          </p>

        `;

      }


      if (photoId) {

        html += `

          <img
            src="https://drive.google.com/thumbnail?id=${encodeURIComponent(
              photoId
            )}&sz=w1000"
            alt="Ілюстрація"
            loading="lazy"
          >

        `;

      }


      if (
        item['Відео']
      ) {

        html += `

          <p>

            <a
              class="video-link"
              href="${escapeHtml(
                item['Відео']
              )}"
              target="_blank"
              rel="noopener"
            >
              ▶️ Відкрити відео
            </a>

          </p>

        `;

      }


      html += `

        </div>

      `;

    }
  );


  app.innerHTML =
    html;

}


/* =====================================================
   TEST CONNECTION
===================================================== */

async function testConnection() {

  const oldText =
    statusElement.textContent;

  statusElement.textContent =
    '● Перевірка...';

  try {

    await apiRequest(
      'sections'
    );

    statusElement.textContent =
      '● Підключення OK';

    statusElement.style.color =
      '#9cffb0';

    setTimeout(
      updateConnectionStatus,
      3000
    );

  }

  catch(error) {

    statusElement.textContent =
      '● Помилка';

    statusElement.style.color =
      '#ffb4b4';

    alert(
      'Не вдалося підключитися:\n\n' +
      error.message
    );

    setTimeout(
      function() {

        statusElement.textContent =
          oldText;

      },
      3000
    );

  }

}


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
  'serviceWorker'
  in navigator
) {

  window.addEventListener(
    'load',
    function() {

      navigator.serviceWorker
        .register(
          './sw.js'
        )
        .then(
          function(registration) {

            console.log(
              'PWA Service Worker OK',
              registration
            );

          }
        )
        .catch(
          function(error) {

            console.error(
              'PWA Service Worker error:',
              error
            );

          }
        );

    }
  );

}


/* =====================================================
   START
===================================================== */

loadSections();

</script>

</body>

</html>
